<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d111a" />
  <meta name="description" content="Proba — PWA offline-first de estudio con bancos de preguntas propios y campañas RPG." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Proba — Estudio y Campañas RPG</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" id="brand-home" title="Ir a Biblioteca">
        <div class="brand-emblem">P</div>
        <span class="brand-title">PROBA</span>
      </div>

      <nav class="nav-tabs" aria-label="Navegación principal">
        <button class="nav-tab active" data-nav="library">📚 Biblioteca</button>
        <button class="nav-tab" data-nav="shop">🏛️ Tienda</button>
        <button class="nav-tab" data-nav="stats">📊 Estadísticas</button>
        <button class="nav-tab" data-nav="settings">⚙️ Ajustes</button>
      </nav>

      <div class="topbar-status">
        <button class="btn btn-sm btn-arcane" id="btn-install-pwa" style="display:none;">Instalar PWA</button>
        <span class="offline-badge" id="connectivity-badge">● Offline listo</span>
        <div class="gold-pill" title="Oro General compartido entre todas las clases">
          <span>🪙</span>
          <span id="topbar-gold-amount">1.000</span>
        </div>
      </div>
    </header>

    <main class="main-container" id="app-main">
      <div class="card" style="text-align:center; padding:2rem;">
        <p class="muted">Cargando Proba...</p>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
